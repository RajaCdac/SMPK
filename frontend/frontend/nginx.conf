server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # API — Django backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Built JS/CSS (Vite hashed filenames) — never fall back to index.html
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public folder copies (carousel banners, favicon, etc.)
    location /images/ {
        try_files $uri =404;
    }

    location = /favicon.svg {
        try_files $uri =404;
    }

    location = /icons.svg {
        try_files $uri =404;
    }

    # Other static extensions — return 404 if missing (not index.html)
    location ~* \.(css|js|mjs|map|png|jpe?g|webp|gif|svg|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
    }

    # React SPA routes — never cache index.html so new builds are picked up
    # immediately (hashed /assets/* stay immutable above).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
}
